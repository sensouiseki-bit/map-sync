<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戦跡調査 右側ビューア</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #1a1a1a; }
    #header {
      height: 42px; background: #2c3e50; color: #fff; display: flex;
      align-items: center; justify-content: space-between; padding: 0 12px; z-index: 1000;
    }
    .select-box {
      padding: 4px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #4a627a;
      background: #34495e; color: #fff; cursor: pointer; outline: none;
    }
    .btn-capture {
      background: #e67e22; color: #fff; border: none; padding: 5px 12px;
      font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer;
    }
    .btn-capture:hover { background: #d35400; }
    #container { flex: 1; display: flex; flex-direction: column; width: 100%; height: calc(100vh - 42px); }
    #map-top { flex: 1; border-bottom: 2px solid #444; position: relative; }
    #map-bottom-container { flex: 1; position: relative; background: #fff; }
    .map-label {
      position: absolute; top: 8px; left: 10px; z-index: 999;
      background: rgba(0, 0, 0, 0.75); color: #fff; padding: 3px 8px;
      font-size: 11px; font-weight: bold; border-radius: 3px; pointer-events: none;
    }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #map-world-terrain { width: 100%; height: 100%; display: none; }
  </style>
</head>
<body>

  <div id="header">
    <div style="font-size: 12px; font-weight: bold;">連動ビュー（過去写真・地形）</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <!-- 国内・海外切替 -->
      <button id="mode-btn" class="btn-capture" style="background: #2980b9;" onclick="toggleMode()">🌐 海外</button>
      <!-- 年代切替（国内時） -->
      <select id="era-select" class="select-box">
        <option value="ort_USA10">上: 1945〜50年(米軍写真)</option>
        <option value="ort_old10">上: 1961〜69年(高度成長期)</option>
        <option value="gazo1">上: 1974〜78年</option>
        <option value="gazo2">上: 1979〜83年</option>
      </select>
      <button class="btn-capture" onclick="captureMaps()">📷 2画面保存</button>
    </div>
  </div>

  <div id="container">
    <!-- 上段：当時の写真（海外時は等高線地形図） -->
    <div id="map-top">
      <div class="map-label" id="label-top">国土地理院 過去航空写真</div>
      <div id="map-top-leaf" style="width: 100%; height: 100%;"></div>
    </div>
    <!-- 下段：地形図（国内時はOH3 / 海外時は世界立体図） -->
    <div id="map-bottom-container">
      <div class="map-label" id="label-bottom">OH3 1m立体図ビューア</div>
      <iframe id="oh3-frame" src=""></iframe>
      <div id="map-world-terrain"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initLat = parseFloat(params.get('lat')) || 34.6873;
    const initLng = parseFloat(params.get('lng')) || 135.5262;
    const initZoom = parseInt(params.get('zoom')) || 16;

    let currentMode = 'japan';

    // 上段マップ
    const mapTop = L.map('map-top-leaf', { zoomControl: true }).setView([initLat, initLng], initZoom);
    let topLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort_USA10/{z}/{x}/{y}.png', {
      attribution: '国土地理院', maxZoom: 18, crossOrigin: true
    }).addTo(mapTop);
    L.marker([initLat, initLng]).addTo(mapTop);

    // 下段（海外用立体図）
    const mapBottom = L.map('map-world-terrain', { zoomControl: false }).setView([initLat, initLng], initZoom);
    let bottomLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri, USGS', maxZoom: 18, crossOrigin: true
    }).addTo(mapBottom);
    L.marker([initLat, initLng]).addTo(mapBottom);

    // 下段（国内用OH3）
    document.getElementById('oh3-frame').src = `https://oh3lab.jp/oh3/#${initZoom}/${initLat}/${initLng}`;

    // 海外モード連動スクロール
    mapTop.on('move', () => {
      if (currentMode === 'world') {
        mapBottom.setView(mapTop.getCenter(), mapTop.getZoom(), { animate: false });
      }
    });

    // 国内・海外切替
    function toggleMode() {
      if (currentMode === 'japan') {
        currentMode = 'world';
        document.getElementById('mode-btn').textContent = '🇯🇵 国内';
        document.getElementById('era-select').style.display = 'none';
        document.getElementById('label-top').textContent = '世界 等高線地形図（OpenTopo）';
        document.getElementById('label-bottom').textContent = '世界 陰影立体図（立体地形）';

        mapTop.removeLayer(topLayer);
        topLayer = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
          attribution: 'OpenTopoMap', maxZoom: 17, crossOrigin: true
        }).addTo(mapTop);

        document.getElementById('oh3-frame').style.display = 'none';
        document.getElementById('map-world-terrain').style.display = 'block';
        mapBottom.invalidateSize();
      } else {
        currentMode = 'japan';
        document.getElementById('mode-btn').textContent = '🌐 海外';
        document.getElementById('era-select').style.display = 'inline-block';
        document.getElementById('label-top').textContent = '国土地理院 過去航空写真';
        document.getElementById('label-bottom').textContent = 'OH3 1m立体図ビューア';

        mapTop.removeLayer(topLayer);
        const eraVal = document.getElementById('era-select').value;
        topLayer = L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${eraVal}/{z}/{x}/{y}.png`, {
          attribution: '国土地理院', maxZoom: 18, crossOrigin: true
        }).addTo(mapTop);

        document.getElementById('map-world-terrain').style.display = 'none';
        document.getElementById('oh3-frame').style.display = 'block';
      }
    }

    // 年代切替
    document.getElementById('era-select').addEventListener('change', (e) => {
      if (currentMode === 'japan') {
        mapTop.removeLayer(topLayer);
        topLayer = L.tileLayer(`https://cyberjapandata.gsi.go.jp/xyz/${e.target.value}/{z}/{x}/{y}.png`, {
          attribution: '国土地理院', maxZoom: 18, crossOrigin: true
        }).addTo(mapTop);
      }
    });

    // キャプチャ保存
    function captureMaps() {
      const container = document.getElementById('container');
      html2canvas(container, { useCORS: true, allowTaint: true, logging: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = `survey_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => alert('保存失敗: ' + err));
    }
  </script>
</body>
</html>
